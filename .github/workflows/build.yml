name: NullGram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply NullGram customization
        run: |
          git apply NullGram-iOS.patch
          mkdir -p Telegram/Telegram-iOS/Telegram.icon/Assets
          cp NullGram.png Telegram/Telegram-iOS/Telegram.icon/Assets/NullGram.png

      - name: Select installed Xcode 27
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then echo "Xcode 27 not found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Renew temporary profiles and build unsigned IPA
        run: |
          set -euo pipefail
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          python3 -c 'from pathlib import Path; p=Path("build-system/Make/GenerateProfiles.py"); s=p.read_text(); old="    # Remove the DER-Encoded-Profile (signature)"; nl=chr(10); insert=nl.join(["    import datetime", "    profile=plistlib.loads(open(parsed_plist_file, \"rb\").read())", "    profile[\"ExpirationDate\"]=datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)+datetime.timedelta(days=3650)", "    with open(parsed_plist_file, \"wb\") as f: plistlib.dump(profile,f)", "", old]); assert s.count(old)==1; p.write_text(s.replace(old,insert,1))'
          python3 -u build-system/Make/Make.py generate-verification-profiles \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --destination=build/renewed-profiles
          cp build/renewed-profiles/*.mobileprovision build-system/fake-codesigning/profiles/
          # Profile generation changes the macOS keychain search list; import and trust the matching self-signed test identity in the ephemeral runner keychain.
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          security add-trusted-cert -r trustRoot -p codeSign -k temp.keychain build-system/fake-codesigning/certs/Public.cer
          PROFILE_SHA1="$(security cms -D -i build-system/fake-codesigning/profiles/Intents.mobileprovision | plutil -extract DeveloperCertificates.0 raw -o - - | base64 -D | shasum -a 1 | awk '{print toupper($1)}')"
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning temp.keychain)"
          echo "$IDENTITY_OUTPUT"
          if ! echo "$IDENTITY_OUTPUT" | grep -qi "$PROFILE_SHA1"; then
            echo "::error::No trusted signing identity matches Intents.mobileprovision; stopping before the long build."
            exit 1
          fi
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"
          mkdir -p build/artifacts
          IPA_PATH="$(find bazel-out -path '*/bin/Telegram/*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then echo "IPA output not found"; exit 1; fi
          cp "$IPA_PATH" build/artifacts/NullGram.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullGram-unsigned-IPA
          path: build/artifacts/NullGram.ipa
          if-no-files-found: error
          retention-days: 7
