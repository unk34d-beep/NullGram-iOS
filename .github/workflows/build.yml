      - name: Remove iOS 27.1-only UIKit APIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'(?m)^[ \t]*if #available\(iOS 27\.1, \*\) \{\n[ \t]*return [^\n]*reservedRegions[^\n]*\n[ \t]*\}\n')
          files = [
              Path("submodules/Display/Source/ReservedArea.swift"),
              Path("submodules/Display/Source/WindowContent.swift"),
          ]
          for path in files:
              source = path.read_text()
              updated, count = pattern.subn("", source)
              if count != 1:
                  raise SystemExit(f"Expected one iOS 27.1 reservedRegions block in {path}, got {count}")
              if "reservedRegions(" in updated:
                  raise SystemExit(f"Unsupported reservedRegions call remains in {path}")
              path.write_text(updated)
              print(f"Removed unsupported iOS 27.1 UIKit call from {path}", flush=True)
          PY

      - name: Disable CloudKit data context
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("submodules/TelegramCore/Sources/Network/Network.swift")
          source = path.read_text()
          pattern = re.compile(
              r'(func makeCloudDataContext\(encryptionProvider: EncryptionProvider\) -> CloudDataContext\? \{)\n.*?\n\}',
              re.S,
          )
          updated, count = pattern.subn(r'\1\n    return nil\n}', source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one makeCloudDataContext function, found {count}")
          function_body = updated.split("func makeCloudDataContext", 1)[1].split("\n}", 1)[0]
          if "CloudDataContextImpl(encryptionProvider" in function_body:
              raise SystemExit("CloudDataContextImpl construction remains after patch")
          path.write_text(updated)
          print("CloudKit data context disabled.", flush=True)
          PY

      - name: Stub Siri authorization (no Siri entitlement)
