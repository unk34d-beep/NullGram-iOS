name: NullGram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_share_screen_onone:
    runs-on: macos-26
    steps:
      - name: Verify Swift -Onone flag
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/flag-check.swift" <<'SWIFT'
          @inline(never) func identity(_ value: Int) -> Int { value }
          print(identity(42))
          SWIFT
          xcrun swiftc -Onone "$RUNNER_TEMP/flag-check.swift" -o "$RUNNER_TEMP/flag-check"
          "$RUNNER_TEMP/flag-check"

  verify_ipa_postprocessing:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Verify Make.py cache arguments
        run: |
          set -euo pipefail
          python3 build-system/Make/Make.py --overrideXcodeVersion --bazelUserRoot="$RUNNER_TEMP/bazel-user-root" --cacheDir="$RUNNER_TEMP/bazel-disk-cache" build --help > "$RUNNER_TEMP/make-build-help.txt"
          grep -F -- '--configurationPath' "$RUNNER_TEMP/make-build-help.txt"
          echo "Make.py accepted --bazelUserRoot and --cacheDir before build."

      - name: Create a fake IPA fixture
        run: |
          set -euo pipefail
          FIXTURE_ROOT="$RUNNER_TEMP/ipa-fixture"
          mkdir -p "$FIXTURE_ROOT/Payload/Test.app/_CodeSignature"
          printf 'fixture executable\n' > "$FIXTURE_ROOT/Payload/Test.app/Test"
          printf 'fixture signature\n' > "$FIXTURE_ROOT/Payload/Test.app/_CodeSignature/CodeResources"
          printf 'fixture profile\n' > "$FIXTURE_ROOT/Payload/Test.app/embedded.mobileprovision"
          (cd "$FIXTURE_ROOT" && zip -qry "$RUNNER_TEMP/fixture.ipa" Payload)
          test -s "$RUNNER_TEMP/fixture.ipa"

      - name: Strip and validate fake IPA
        run: |
          set -euo pipefail
          bash build-system/Make/PrepareUnsignedIPA.sh "$RUNNER_TEMP/fixture.ipa" "$RUNNER_TEMP/output/NullGram.ipa"
          unzip -Z1 "$RUNNER_TEMP/output/NullGram.ipa" | grep -F 'Payload/Test.app/Test'
          if unzip -Z1 "$RUNNER_TEMP/output/NullGram.ipa" | grep -E '(_CodeSignature|embedded\.mobileprovision)'; then
            echo "::error::Signature data remains in fixture IPA"
            exit 1
          fi

      - name: Test IPA artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: IPA-postprocessing-smoke-fixture
          path: ${{ runner.temp }}/output/NullGram.ipa
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [verify_share_screen_onone, verify_ipa_postprocessing]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply NullGram customization
        run: |
          set -euo pipefail
          git apply --check NullGram-iOS.patch
          git apply NullGram-iOS.patch
          git apply --check --ignore-whitespace NullGram-iOS-fixes.patch
          git apply --ignore-whitespace NullGram-iOS-fixes.patch
          mkdir -p Telegram/Telegram-iOS/Telegram.icon/Assets
          test -s NullGram.png
          cp NullGram.png Telegram/Telegram-iOS/Telegram.icon/Assets/NullGram.png
          mkdir -p submodules/RMIntro/Sources/platform/ios/Resources
          cp NullGram.png submodules/RMIntro/Sources/platform/ios/Resources/NullGram.png


      - name: Apply NullGram onboarding, login, stars and app-name text
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path_text, old, new, expected=1):
              path = Path(path_text)
              source = path.read_text()
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count} for {old!r}")
              path.write_text(source.replace(old, new, expected))
              print(f"Patched {path}: {expected} replacement(s)", flush=True)

          # Pass the selected UI language and tour copy from Swift into RMIntro.
          replace_exact(
              "submodules/AuthorizationUI/Sources/AuthorizationSequenceController.swift",
              "AuthorizationSequenceSplashController(accountManager: self.sharedContext.accountManager, account: self.account, theme: self.presentationData.theme)",
              "AuthorizationSequenceSplashController(accountManager: self.sharedContext.accountManager, account: self.account, theme: self.presentationData.theme, strings: self.presentationData.strings)",
          )
          replace_exact(
              "submodules/AuthorizationUI/Sources/AuthorizationSequenceSplashController.swift",
              "init(accountManager: AccountManager<TelegramAccountManagerTypes>, account: UnauthorizedAccount, theme: PresentationTheme) {",
              "init(accountManager: AccountManager<TelegramAccountManagerTypes>, account: UnauthorizedAccount, theme: PresentationTheme, strings: PresentationStrings) {",
          )
          old_call = "        self.controller = RMIntroViewController(backgroundColor: theme.list.plainBackgroundColor, primaryColor: theme.list.itemPrimaryTextColor, buttonColor: theme.intro.startButtonColor, accentColor: theme.list.itemAccentColor, regularDotColor: theme.intro.dotColor, highlightedDotColor: theme.list.itemAccentColor, suggestedLocalizationSignal: localizationSignal)"
          new_call = """        let isRussian = strings.baseLanguageCode.hasPrefix("ru")
          let tourHeadlines = isRussian
              ? ["NullGram", "Облегчённый", "Бесплатный", "Безлимитный", "Защищённый", "Облако"]
              : ["NullGram", "Lightweight", "Free", "Unlimited", "Secure", "Cloud"]
          let tourDescriptions = isRussian
              ? [
                  "Неофициальный клиент Telegram от @TheNullV4",
                  "Удалены все ненужные функции, которые нагружают телефон",
                  "Это вам не «Вероника», которая просит выйти из iCloud и установить NullGram",
                  "Вам не надо платить за место на серверах Telegram (не то что ваш iCloud+)",
                  "Мы не видим ваши переписки, так как вы используете Telegram API",
                  "Там ваши переписки и всё подобное"
                ]
              : [
                  "Unofficial Telegram client by @TheNullV4",
                  "All unnecessary features that drain your phone have been removed",
                  "Unlike “Veronica”, we won't ask you to sign out of iCloud to install NullGram",
                  "You don't pay for space on Telegram's servers (unlike your iCloud+)",
                  "We can't see your chats, because you connect through the Telegram API",
                  "Your chats and everything else are stored there"
                ]
          self.controller = RMIntroViewController(backgroundColor: theme.list.plainBackgroundColor, primaryColor: theme.list.itemPrimaryTextColor, buttonColor: theme.intro.startButtonColor, accentColor: theme.list.itemAccentColor, regularDotColor: theme.intro.dotColor, highlightedDotColor: theme.list.itemAccentColor, headlines: tourHeadlines, descriptions: tourDescriptions, suggestedLocalizationSignal: localizationSignal)"""
          replace_exact("submodules/AuthorizationUI/Sources/AuthorizationSequenceSplashController.swift", old_call, new_call)
          replace_exact("submodules/AuthorizationUI/Sources/AuthorizationSequenceSplashController.swift",
              "// The tour is shown in English (it reads the en bundle); the page indicator's VoiceOver label follows it.",
              "// Tour headings and descriptions use the selected Russian or English UI language.")
          replace_exact(
              "submodules/RMIntro/PublicHeaders/RMIntro/RMIntroViewController.h",
              "highlightedDotColor:(UIColor *)highlightedDotColor suggestedLocalizationSignal:(SSignal *)suggestedLocalizationSignal;",
              "highlightedDotColor:(UIColor *)highlightedDotColor headlines:(NSArray<NSString *> *)headlines descriptions:(NSArray<NSString *> *)descriptions suggestedLocalizationSignal:(SSignal *)suggestedLocalizationSignal;",
          )
          replace_exact(
              "submodules/RMIntro/Sources/platform/ios/RMIntroViewController.m",
              "highlightedDotColor:(UIColor *)highlightedDotColor suggestedLocalizationSignal:(SSignal *)suggestedLocalizationSignal\n",
              "highlightedDotColor:(UIColor *)highlightedDotColor headlines:(NSArray<NSString *> *)headlines descriptions:(NSArray<NSString *> *)descriptions suggestedLocalizationSignal:(SSignal *)suggestedLocalizationSignal\n",
          )
          replace_exact(
              "submodules/RMIntro/Sources/platform/ios/RMIntroViewController.m",
              '        _headlines = @[ _englishStrings[@"Tour.Title1"], _englishStrings[@"Tour.Title2"],  _englishStrings[@"Tour.Title6"], _englishStrings[@"Tour.Title3"], _englishStrings[@"Tour.Title4"], _englishStrings[@"Tour.Title5"]];',
              "        _headlines = headlines;",
          )
          replace_exact(
              "submodules/RMIntro/Sources/platform/ios/RMIntroViewController.m",
              '_descriptions = @[_englishStrings[@"Tour.Text1"], _englishStrings[@"Tour.Text2"],  _englishStrings[@"Tour.Text6"], _englishStrings[@"Tour.Text3"], _englishStrings[@"Tour.Text4"], _englishStrings[@"Tour.Text5"]];',
              "        _descriptions = descriptions;",
          )

          # Bundle the provided NullGram artwork into the app and show it over the intro animation.
          rm_intro_build = Path("submodules/RMIntro/BUILD")
          source = rm_intro_build.read_text()
          marker = 'objc_library(\n    name = "RMIntro",'
          if source.count(marker) != 1 or 'name = "NullGramLogo"' in source:
              raise SystemExit("RMIntro BUILD anchor missing or NullGramLogo already exists")
          source = source.replace(marker, 'filegroup(\n    name = "NullGramLogo",\n    srcs = ["Sources/platform/ios/Resources/NullGram.png"],\n)\n\n' + marker, 1)
          rm_intro_build.write_text(source)
          telegram_build = Path("Telegram/BUILD")
          source = telegram_build.read_text()
          marker = '    resources = [\n        ":LaunchScreen",'
          if source.count(marker) != 1 or '"//submodules/RMIntro:NullGramLogo"' in source:
              raise SystemExit("Telegram resources anchor missing or NullGramLogo already registered")
          telegram_build.write_text(source.replace(marker, marker + '\n        "//submodules/RMIntro:NullGramLogo",', 1))
          controller = Path("submodules/RMIntro/Sources/platform/ios/RMIntroViewController.m")
          replace_exact(str(controller),
              "    UIView *_startButton;\n",
              "    UIView *_startButton;\n    UIImageView *_nullGramLogoView;\n")
          source = controller.read_text()
          marker = "        [self.view addSubview:_glkView];\n"
          if source.count(marker) != 1 or "[_glkView addSubview:_nullGramLogoView]" in source:
              raise SystemExit("RMIntro logo insertion anchor missing or already patched")
          source = source.replace(marker, marker + """        _nullGramLogoView = [[UIImageView alloc] initWithImage:[UIImage imageNamed:@"NullGram"]];
          _nullGramLogoView.frame = _glkView.bounds;
          _nullGramLogoView.contentMode = UIViewContentModeScaleAspectFit;
          _nullGramLogoView.userInteractionEnabled = false;
          _nullGramLogoView.hidden = _currentPage != 0;
          [_glkView addSubview:_nullGramLogoView];
          """, 1)
          controller.write_text(source)
          replace_exact(str(controller),
              "        _currentPage = MAX(0, MIN(5, _currentPage));\n",
              "        _currentPage = MAX(0, MIN(5, _currentPage));\n        _nullGramLogoView.hidden = _currentPage != 0;\n")
          replace_exact(str(controller),
              "    _currentPage = page;\n",
              "    _currentPage = page;\n    _nullGramLogoView.hidden = _currentPage != 0;\n")
          replace_exact(str(controller),
              "    UIImage *image = _glkView.snapshot;",
              "    UIImage *image = (_currentPage == 0 && _nullGramLogoView.image != nil) ? _nullGramLogoView.image : _glkView.snapshot;");


          # RU/EN login labels are set at render time so server localization packs cannot overwrite them.
          phone_node = "submodules/AuthorizationUI/Sources/AuthorizationSequencePhoneEntryControllerNode.swift"
          replace_exact(phone_node,
              "account == nil ? strings.Login_NewNumber : strings.Login_PhoneTitle",
              'strings.baseLanguageCode.hasPrefix("ru") ? "Номер телефона" : "Phone number"')
          replace_exact(phone_node,
              "account == nil ? strings.ChangePhoneNumberNumber_Help : strings.Login_PhoneAndCountryHelp",
              'account == nil ? (strings.baseLanguageCode.hasPrefix("ru") ? "Выберите регион и введите свой номер телефона ниже" : "Select your region and enter your phone number below") : strings.Login_PhoneAndCountryHelp')
          replace_exact(phone_node,
              "self.account == nil ? self.strings.Login_NewNumber : self.strings.Login_PhoneTitle",
              'self.strings.baseLanguageCode.hasPrefix("ru") ? "Номер телефона" : "Phone number"')
          replace_exact(phone_node,
              "NSAttributedString(string: strings.Login_PhoneNumberConfirmation, font:",
              'NSAttributedString(string: strings.baseLanguageCode.hasPrefix("ru") ? "Здесь всё указано правильно?" : "Is everything correct here?", font:')
          replace_exact(phone_node,
              "self.cancelButton.setTitle(strings.Login_Edit, with:",
              'self.cancelButton.setTitle(strings.baseLanguageCode.hasPrefix("ru") ? "Поправить" : "Edit", with:')
          replace_exact(phone_node,
              "self.cancelButton.accessibilityLabel = strings.Login_Edit",
              'self.cancelButton.accessibilityLabel = strings.baseLanguageCode.hasPrefix("ru") ? "Поправить" : "Edit"')
          replace_exact(phone_node,
              "SolidRoundedButtonNode(title: strings.Login_Continue, theme: SolidRoundedButtonTheme(theme: theme), glass: false, height: 50.0, cornerRadius: 50.0 * 0.5)",
              'SolidRoundedButtonNode(title: strings.baseLanguageCode.hasPrefix("ru") ? "Да" : "Yes", theme: SolidRoundedButtonTheme(theme: theme), glass: false, height: 50.0, cornerRadius: 50.0 * 0.5)')

          phone_controller = "submodules/AuthorizationUI/Sources/AuthorizationSequencePhoneEntryController.swift"
          replace_exact(phone_controller,
              "title: self.presentationData.strings.Login_Edit",
              'title: self.presentationData.strings.baseLanguageCode.hasPrefix("ru") ? "Поправить" : "Edit"')
          replace_exact(phone_controller,
              "title: self.presentationData.strings.Login_Yes",
              'title: self.presentationData.strings.baseLanguageCode.hasPrefix("ru") ? "Да" : "Yes"')
          replace_exact(phone_controller,
              "text: self.presentationData.strings.Login_PhoneNumberConfirmation",
              'text: self.presentationData.strings.baseLanguageCode.hasPrefix("ru") ? "Здесь всё указано правильно?" : "Is everything correct here?"')

          code_node = "submodules/AuthorizationUI/Sources/AuthorizationSequenceCodeEntryControllerNode.swift"
          replace_exact(code_node, "self.strings.Login_EnterCodeTelegramTitle",
              'self.strings.baseLanguageCode.hasPrefix("ru") ? "Введите код" : "Enter code"', expected=2)
          auth_text = "submodules/AuthorizationUtils/Sources/AuthorizationOptionText.swift"
          replace_exact(auth_text,
              "return parseMarkdownIntoAttributedString(strings.Login_EnterCodeTelegramText(phoneNumber).string, attributes: attributes, textAlignment: .center)",
              'let message = strings.baseLanguageCode.hasPrefix("ru") ? "Код отправлен **в ваш Telegram-аккаунт**, а не по SMS" : "The code was sent **to your Telegram account**, not by SMS"\n        return parseMarkdownIntoAttributedString(message, attributes: attributes, textAlignment: .center)')
          replace_exact(auth_text,
              "strings.Login_HaveNotReceivedCodeInternal",
              '(strings.baseLanguageCode.hasPrefix("ru") ? "Нет кода?" : "No code?")',
              expected=2)

          code_controller = "submodules/AuthorizationUI/Sources/AuthorizationSequenceCodeEntryController.swift"
          code_controller_path = Path("submodules/AuthorizationUI/Sources/AuthorizationSequenceCodeEntryController.swift")
          source = code_controller_path.read_text()
          old_block = "\n".join([
              "                text = presentationData.strings.Login_CancelPhoneVerification",
              "                proceed = presentationData.strings.Login_CancelPhoneVerificationContinue",
              "                stop = presentationData.strings.Login_CancelPhoneVerificationStop",
          ])
          new_block = "\n".join([
              "                let isRussian = presentationData.strings.baseLanguageCode.hasPrefix(\"ru\")",
              "                text = isRussian ? \"Вы хотите прервать вход в аккаунт?\" : \"Do you want to cancel signing in?\"",
              "                proceed = isRussian ? \"Нет\" : \"No\"",
              "                stop = isRussian ? \"Да\" : \"Yes\"",
          ])
          if source.count(old_block) != 1:
              raise SystemExit(f"Expected one phone verification cancellation block, found {source.count(old_block)}")
          code_controller_path.write_text(source.replace(old_block, new_block, 1))
          print("Patched phone sign-in cancellation confirmation.", flush=True)

          replace_exact(
              "submodules/TelegramUI/Components/Gifts/GiftStoreScreen/Sources/GiftStoreScreen.swift",
              "presentationData.strings.Gift_Store_Balance_MyStars",
              'presentationData.strings.baseLanguageCode.hasPrefix("ru") ? "Звёзды" : "Stars"',
          )

          # The only localized display-name overrides in InfoPlist.strings must agree with the bundle name.
          name_files = list(Path("Telegram/Telegram-iOS").glob("*.lproj/InfoPlist.strings"))
          found = 0
          for path in name_files:
              source = path.read_text()
              updated, count = re.subn(r'(?m)^("CFBundleDisplayName"\s*=\s*)"[^"]*";', r'\1"NullGram";', source)
              found += count
              path.write_text(updated)
          if found < 1:
              raise SystemExit("No localized CFBundleDisplayName entries found")
          for path in name_files:
              if re.search(r'(?m)^"CFBundleDisplayName"\s*=\s*"(?!NullGram")[^"]*";', path.read_text()):
                  raise SystemExit(f"Unexpected localized app name remains in {path}")
          print(f"Set NullGram display name in {found} localized InfoPlist.strings entries.", flush=True)
          PY

      - name: Remove iOS 27.1-only UIKit APIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'(?m)^[ \t]*if #available\(iOS 27\.1, \*\) \{\n[ \t]*return [^\n]*reservedRegions[^\n]*\n[ \t]*\}\n')
          files = [
              Path("submodules/Display/Source/ReservedArea.swift"),
              Path("submodules/Display/Source/WindowContent.swift"),
          ]
          for path in files:
              source = path.read_text()
              updated, count = pattern.subn("", source)
              if count != 1:
                  raise SystemExit(f"Expected one iOS 27.1 reservedRegions block in {path}, got {count}")
              if "reservedRegions(" in updated:
                  raise SystemExit(f"Unsupported reservedRegions call remains in {path}")
              path.write_text(updated)
              print(f"Removed unsupported iOS 27.1 UIKit call from {path}", flush=True)
          PY

      - name: Disable CloudKit data context
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("submodules/TelegramCore/Sources/Network/Network.swift")
          source = path.read_text()
          pattern = re.compile(
              r'(func makeCloudDataContext\(encryptionProvider: EncryptionProvider\) -> CloudDataContext\? \{)\n.*?\n\}',
              re.S,
          )
          updated, count = pattern.subn(r'\1\n    return nil\n}', source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one makeCloudDataContext function, found {count}")
          function_body = updated.split("func makeCloudDataContext", 1)[1].split("\n}", 1)[0]
          if "CloudDataContextImpl(encryptionProvider" in function_body:
              raise SystemExit("CloudDataContextImpl construction remains after patch")
          path.write_text(updated)
          print("CloudKit data context disabled.", flush=True)
          PY

      - name: Stub Siri authorization (no Siri entitlement)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("submodules/TelegramUI/Sources/AppDelegate.swift")
          source = path.read_text()
          if "enum NullINPreferences" in source:
              raise SystemExit("Siri authorization stub is already present")
          updated, count = re.subn(r'\bINPreferences\.', 'NullINPreferences.', source)
          if count < 1:
              raise SystemExit("INPreferences not found")
          shim = '''

          enum NullINPreferences {
              static func siriAuthorizationStatus() -> INSiriAuthorizationStatus { return .denied }
              static func requestSiriAuthorization(_ handler: @escaping (INSiriAuthorizationStatus) -> Void) { handler(.denied) }
          }
          '''
          path.write_text(updated + shim)
          print(f"Siri authorization stubbed ({count} call sites)", flush=True)
          PY

      - name: Fall back when App Group entitlement is unavailable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("submodules/TelegramUI/Sources/AppDelegate.swift")
          source = path.read_text()

          replacements = [
              (
                  '    private var urlSessions: [URLSession] = []\n',
                  '    private var hasSharedAppGroupContainer = false\n    private var urlSessions: [URLSession] = []\n',
                  "URLSession state property",
              ),
              (
                  '        configuration.sharedContainerIdentifier = appGroupName\n',
                  '        if self.hasSharedAppGroupContainer {\n            configuration.sharedContainerIdentifier = appGroupName\n        }\n',
                  "background URLSession shared container",
              ),
              (
                  '        let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)\n',
                  '''        let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)
                  self.hasSharedAppGroupContainer = maybeAppGroupUrl != nil
                  let appGroupUrl: URL
                  if let maybeAppGroupUrl {
                      appGroupUrl = maybeAppGroupUrl
                  } else {
                      let fallbackUrl = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask)[0].appendingPathComponent("NullGram", isDirectory: true)
                      do {
                          try FileManager.default.createDirectory(at: fallbackUrl, withIntermediateDirectories: true)
                          appGroupUrl = fallbackUrl
                      } catch {
                          NSLog("Failed to create local app data directory: %@", String(describing: error))
                          self.mainWindow?.presentNative(UIAlertController(title: nil, message: "Unable to create local app data directory.", preferredStyle: .alert))
                          return true
                      }
                  }
          ''',
                  "app-group storage fallback",
              ),
              (
                  '''        guard let appGroupUrl = maybeAppGroupUrl else {
                      self.mainWindow?.presentNative(UIAlertController(title: nil, message: "Error 2", preferredStyle: .alert))
                      return true
                  }
          ''',
                  "",
                  "blocking App Group guard",
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} target in {path}, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          print("App Group fallback applied; local storage will be used when the entitlement is missing.", flush=True)
          PY

      - name: Set ShareScreen to -Onone
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("submodules/TelegramUI/Components/ShareScreen/BUILD")
          source = path.read_text()
          old = '    copts = [\n        "-warnings-as-errors",\n    ],'
          new = '    copts = [\n        "-warnings-as-errors",\n        "-Onone",\n    ],'
          if source.count(old) != 1:
              raise SystemExit(f"Expected one ShareScreen copts block, got {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          print("Disabled CopyPropagation for ShareScreen only", flush=True)
          PY

      - name: Select Xcode 26.6 with iOS 26.5 SDK
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.6*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then echo "::error::Xcode 26.6 not found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -F 'iOS 26.5'

      - name: Generate temporary provisioning profiles
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build-system/Make/GenerateProfiles.py')
          source = path.read_text()
          needle = "    # Remove the DER-Encoded-Profile (signature)"
          new_lines = [
              "    import datetime",
              "    profile = plistlib.loads(open(parsed_plist_file, 'rb').read())",
              "    profile['ExpirationDate'] = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None) + datetime.timedelta(days=3650)",
              "    with open(parsed_plist_file, 'wb') as stream: plistlib.dump(profile, stream)",
              needle,
          ]
          if source.count(needle) != 1:
              raise SystemExit(f'Expected one profile signature marker, got {source.count(needle)}')
          path.write_text(source.replace(needle, chr(10).join(new_lines), 1))
          print('Applied temporary profile expiration adjustment.', flush=True)
          PY
          mkdir -p build/renewed-profiles
          echo "Generating profiles..."
          python3 -u build-system/Make/Make.py generate-verification-profiles --configurationPath="build-system/appstore-configuration.json" --codesigningInformationPath=build-system/fake-codesigning --destination=build/renewed-profiles
          PROFILE_COUNT="$(find build/renewed-profiles -maxdepth 1 -name '*.mobileprovision' -type f | wc -l | tr -d ' ')"
          echo "Generated profile count: $PROFILE_COUNT"
          test "$PROFILE_COUNT" -eq 9
          cp build/renewed-profiles/*.mobileprovision build-system/fake-codesigning/profiles/
          test -s build-system/fake-codesigning/profiles/Intents.mobileprovision
          echo "Profiles copied and validated."

      - name: Import temporary build identity
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -u build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
