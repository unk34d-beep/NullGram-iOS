name: NullGram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply NullGram customization
        run: |
          set -euo pipefail
          git apply --check NullGram-iOS.patch
          git apply NullGram-iOS.patch
          git apply --check --ignore-whitespace NullGram-iOS-fixes.patch
          git apply --ignore-whitespace NullGram-iOS-fixes.patch
          mkdir -p Telegram/Telegram-iOS/Telegram.icon/Assets
          test -s NullGram.png
          cp NullGram.png Telegram/Telegram-iOS/Telegram.icon/Assets/NullGram.png


      - name: Remove iOS 27.1-only UIKit APIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'(?m)^[ \t]*if #available\(iOS 27\.1, \*\) \{\n[ \t]*return [^\n]*reservedRegions[^\n]*\n[ \t]*\}\n')
          files = [
              Path("submodules/Display/Source/ReservedArea.swift"),
              Path("submodules/Display/Source/WindowContent.swift"),
          ]
          for path in files:
              source = path.read_text()
              updated, count = pattern.subn("", source)
              if count != 1:
                  raise SystemExit(f"Expected one iOS 27.1 reservedRegions block in {path}, got {count}")
              if "reservedRegions(" in updated:
                  raise SystemExit(f"Unsupported reservedRegions call remains in {path}")
              path.write_text(updated)
              print(f"Removed unsupported iOS 27.1 UIKit call from {path}", flush=True)
          PY

      - name: Select Xcode 26.6 with iOS 26.5 SDK
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.6*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then echo "::error::Xcode 26.6 not found"; exit 1; fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -F 'iOS 26.5'

      - name: Generate temporary provisioning profiles
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build-system/Make/GenerateProfiles.py')
          source = path.read_text()
          needle = "    # Remove the DER-Encoded-Profile (signature)"
          new_lines = [
              "    import datetime",
              "    profile = plistlib.loads(open(parsed_plist_file, 'rb').read())",
              "    profile['ExpirationDate'] = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None) + datetime.timedelta(days=3650)",
              "    with open(parsed_plist_file, 'wb') as stream: plistlib.dump(profile, stream)",
              needle,
          ]
          if source.count(needle) != 1:
              raise SystemExit(f'Expected one profile signature marker, got {source.count(needle)}')
          path.write_text(source.replace(needle, chr(10).join(new_lines), 1))
          print('Applied temporary profile expiration adjustment.', flush=True)
          PY
          mkdir -p build/renewed-profiles
          echo "Generating profiles..."
          python3 -u build-system/Make/Make.py generate-verification-profiles --configurationPath="build-system/appstore-configuration.json" --codesigningInformationPath=build-system/fake-codesigning --destination=build/renewed-profiles
          PROFILE_COUNT="$(find build/renewed-profiles -maxdepth 1 -name '*.mobileprovision' -type f | wc -l | tr -d ' ')"
          echo "Generated profile count: $PROFILE_COUNT"
          test "$PROFILE_COUNT" -eq 9
          cp build/renewed-profiles/*.mobileprovision build-system/fake-codesigning/profiles/
          test -s build-system/fake-codesigning/profiles/Intents.mobileprovision
          echo "Profiles copied and validated."

      - name: Import temporary build identity
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -u build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          PROFILE_SHA1="$(security cms -D -i build-system/fake-codesigning/profiles/Intents.mobileprovision | plutil -extract DeveloperCertificates.0 raw -o - - | base64 -D | shasum -a 1 | awk '{print toupper($1)}')"
          CERT_SHA1="$(openssl x509 -inform DER -in build-system/fake-codesigning/certs/Public.cer -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "Profile certificate SHA1: $PROFILE_SHA1"
          echo "Build certificate SHA1: $CERT_SHA1"
          if [ "$PROFILE_SHA1" != "$CERT_SHA1" ]; then echo "::error::Intents profile certificate does not match the temporary build certificate"; exit 1; fi
          echo "Temporary build identity is ready; no personal signing key is used."

      - name: Build IPA for Sideloadly
        timeout-minutes: 300
        run: |
          set -euo pipefail
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "Starting Bazel build; build number $BUILD_NUMBER"
          python3 -u build-system/Make/Make.py --overrideXcodeVersion --bazelUserRoot="/private/var/tmp/_bazel_containerhost" build --configurationPath="build-system/appstore-configuration.json" --codesigningInformationPath=build-system/fake-codesigning --configuration=release_arm64 --buildNumber="$BUILD_NUMBER"
          mkdir -p build/artifacts
          IPA_PATH="$(find bazel-out -path '*/bin/Telegram/*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then echo "::error::IPA output not found"; exit 1; fi
          cp "$IPA_PATH" build/artifacts/NullGram.ipa
          test -s build/artifacts/NullGram.ipa
          echo "IPA created: $(du -h build/artifacts/NullGram.ipa | cut -f1)"

      - name: Remove temporary signatures for Sideloadly
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          ditto -x -k build/artifacts/NullGram.ipa "$WORK_DIR"
          test -d "$WORK_DIR/Payload"
          while IFS= read -r -d '' code; do
            codesign --remove-signature "$code" 2>/dev/null || true
          done < <(find "$WORK_DIR/Payload" -depth \( -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' -o -name '*.xpc' \) -o -type f -name '*.dylib' \) -print0)
          find "$WORK_DIR/Payload" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$WORK_DIR/Payload" -type f -name embedded.mobileprovision -delete
          rm -f build/artifacts/NullGram.ipa
          (cd "$WORK_DIR" && zip -qry "$GITHUB_WORKSPACE/build/artifacts/NullGram.ipa" Payload)
          test -s build/artifacts/NullGram.ipa
          if find "$WORK_DIR/Payload" \( -type d -name _CodeSignature -o -type f -name embedded.mobileprovision \) -print -quit | grep -q .; then
            echo "::error::Signature data remains in the Sideloadly IPA"
            exit 1
          fi
          echo "Temporary signatures and provisioning profiles removed."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullGram-unsigned-IPA
          path: build/artifacts/NullGram.ipa
          if-no-files-found: error
          retention-days: 7
